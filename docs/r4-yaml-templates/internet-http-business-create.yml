# Internet HTTP business create template.
# Replace names, VIPs, ports, node addresses, and SNAT addresses before upload.
#
# The live AD HTTP virtual-service API exposes SNAT binding fields. This
# template creates a named SNAT address set and binds the HTTP virtual service
# to that set with snat: SNAT-POOL / snat_pool.
version: 1
source: "base YAML template: internet HTTP business create"
operations:
  - id: create-snat-pool
    action: create
    schema: config.snat_rule
    document: slb/snat-pool.js
    payload:
      name: internet_http_snat_pool
      description: Internet HTTP business SNAT address set.
      address:
        - 198.51.100.10
      hash_policy: SRC-IP
      associated_application_group: Default
      arp_nd_reply: ENABLE
      distribute_policy: DISABLE
      distribute_delay: AUTO

  - id: create-tcp-profile-l7
    action: create
    schema: config.tcp_profile_l7_proxy
    document: slb/tcp-profile/l7-proxy.js
    payload:
      name: internet_http_tcp_profile
      description: Internet HTTP business L7 TCP optimization profile.
      type: L7-PROXY
      idle_timeout: 600
      timewait_timeout_ms: 10000
      maximum_segment_size: 1460
      auto_adjust_mss:
        state: ENABLE
        back_maximum_segment_size: 1460
      time_stamp: ENABLE
      timewait_recycle: ENABLE
      reset_invalid_connection: ENABLE
      close_node_connection_with_rst: ENABLE
      close_client_connection_with_rst: ENABLE
      node_fault_close_connection: DISABLE
      delay_ack: DISABLE
      sack_support: ENABLE
      dsack_support: DISABLE
      fast_tcp: DISABLE
      service_unavailable_refuse_connection: NONE

  - id: create-http-profile-xff
    action: create
    schema: config.http_profile
    document: slb/http-profile.js
    payload:
      name: internet_http_xff_profile
      description: Internet HTTP business HTTP optimization profile with XFF.
      source_address:
        operation: REQUEST-HEADER-INSERT-SRCIP
        request_header: X-Forwarded-For

  - id: create-node-pool
    action: create
    schema: config.pool
    document: slb/pool.js
    payload:
      name: internet_http_pool
      description: Internet HTTP backend node pool.
      method: ROUND-ROBIN
      priority_level_available_node: 0
      nodes:
        - name: node_1_192_0_2_51_80
          type: ADDRESS
          address: 192.0.2.51
          port: 80
          state: ENABLE
          weight: 10
          priority_level: 1
        - name: node_2_192_0_2_52_80
          type: ADDRESS
          address: 192.0.2.52
          port: 80
          state: ENABLE
          weight: 10
          priority_level: 1

  - id: create-http-virtual-service
    action: create
    schema: config.virtual_service
    document: slb/virtual-service/http.js
    payload:
      name: internet_http_vs
      description: Internet HTTP virtual service.
      state: ENABLE
      service: HTTP
      vips:
        - 10.250.250.80
      vports:
        - "80"
      pool: internet_http_pool
      http_sched_mode: REQUEST
      tcp_profile: internet_http_tcp_profile
      http_profile: internet_http_xff_profile
      snat: SNAT-POOL
      snat_pool: internet_http_snat_pool
      source_port: PRESERVE
